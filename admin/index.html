<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>内容管理 · Cheney</title><link rel="stylesheet" href="/assets/admin.css?v=20261020-05"><script src="/assets/admin-connection.js?v=20261020-01" defer></script><link rel="stylesheet" href="/assets/admin-site.css?v=20261020-05"><script src="/assets/admin-batch.js?v=20261020-05" defer></script><script src="/assets/admin-journey.js?v=20261020-05" defer></script><script src="/assets/admin-chapters.js?v=20261020-05" defer></script><script src="/assets/admin-page-fields.js?v=20261020-05" defer></script><script src="/assets/admin-site.js?v=20261020-05" defer></script><script src="/assets/admin.js?v=20261020-05" defer></script></head>
<body><header class="admin-bar"><a class="admin-brand" href="/">Cheney <span>书斋 · 内容管理</span></a><nav><a href="/" target="_blank" rel="noopener">查看网站 ↗</a><button type="button" id="logout" hidden>退出登录</button></nav></header>
<main id="login-screen" class="login-screen"><section class="login-card"><span class="eyebrow">一方书斋 · 随时续写</span><h1>回到你的书斋</h1><p id="login-note">登录后整理文字、作品与日常收藏。</p><form id="login-form"><label>站主密码<input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128"></label><label id="confirm-label" hidden>再次输入密码<input name="confirm" type="password" autocomplete="new-password" maxlength="128"></label><button class="primary" type="submit" id="login-submit">登录后台</button></form><p id="login-status" role="status" class="status"></p><p class="login-foot">前台公开浏览，内容管理仅对站主开放。</p></section></main>
<div id="admin-app" class="admin-shell" hidden><aside class="admin-sidebar"><div class="sidebar-head"><span class="eyebrow">我的网站</span><h2>内容目录</h2></div><nav id="admin-nav" aria-label="后台导航"></nav><div class="sidebar-foot"><button type="button" id="backup">下载内容备份</button><button type="button" data-view="security">修改登录密码</button></div></aside><main class="admin-main" id="admin-main"><div class="workspace-heading"><div><span class="eyebrow" id="view-kicker">留存与续写</span><h1 id="view-title">文存</h1><p id="view-note">整理已有篇目，也把新的体会写下来。</p></div><button type="button" class="primary" id="new-entry">＋ 新增内容</button></div><p id="cloud-note" class="cloud-note" hidden></p><p class="status" id="app-status" role="status" aria-live="polite"></p><div id="workspace" class="workspace"></div></main></div>
<dialog id="history-dialog"><div class="dialog-head"><h2>历史版本</h2><button type="button" id="history-close" aria-label="关闭历史版本">×</button></div><p>恢复后先存为草稿，确认后再发布。</p><div id="history-items"></div></dialog>
</body></html>
