[build]
  base = "services/interaction"
  command = "cd ../.. && npm run build"
  publish = "../../dist"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

# Both public addresses build the same repository snapshot. Never cache the
# publication checks or public content data as immutable assets.
[[headers]]
  for = "/assets/*.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
