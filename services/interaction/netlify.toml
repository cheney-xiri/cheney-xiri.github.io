[build]
  base = "services/interaction"
  publish = "public"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../../server/interaction-gateway.mjs ../../server/edge-runtime.mjs"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
